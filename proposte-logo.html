<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposte Nuovo Logo - Piazza Marconi Cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#faf9f6] text-[#2d3436] min-h-screen py-12 px-4">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-serif text-[#0c2461] mb-4">Proposte Nuovo Logo</h1>
            <p class="text-gray-500">Versione di prova senza sfondo nero. Selezionate il vostro preferito.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <!-- Opzione 1 -->
            <div class="bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center hover:scale-105 transition-transform">
                <h2 class="text-xl font-bold text-[#0c2461] mb-8 font-serif">Opzione 1</h2>
                <p class="text-xs text-center text-gray-400 mb-8 uppercase tracking-widest">Minimalista & Lineare</p>
                <div class="w-full aspect-square flex items-center justify-center bg-[#faf9f6] rounded-xl p-4">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
                        <path d="M 180 80 C 180 110, 190 120, 200 120 C 210 120, 220 110, 220 80 Z" fill="none" stroke="#d4af37" stroke-width="2" />
                        <path d="M 220 85 C 235 85, 235 105, 220 105" fill="none" stroke="#d4af37" stroke-width="2" />
                        <path d="M 170 125 L 230 125" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
                        <path d="M 195 70 Q 200 60, 195 50 Q 190 40, 200 35" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" />
                        <path d="M 205 70 Q 210 60, 205 50 Q 200 40, 210 35" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" />
                        <text x="200" y="180" font-family="'Playfair Display', serif" font-size="36" fill="#0c2461" text-anchor="middle" font-style="italic" letter-spacing="2">Piazza Marconi</text>
                        <text x="200" y="215" font-family="'Playfair Display', serif" font-size="20" fill="#0c2461" text-anchor="middle" letter-spacing="6">CAFE'</text>
                        <text x="200" y="255" font-family="Inter, sans-serif" font-size="12" fill="#666666" text-anchor="middle" letter-spacing="4">CALTANISSETTA</text>
                    </svg>
                </div>
            </div>

            <!-- Opzione 2 -->
            <div class="bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center hover:scale-105 transition-transform relative border-2 border-[#d4af37]">
                <div class="absolute -top-4 bg-[#d4af37] text-white px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest shadow-md">Moderna</div>
                <h2 class="text-xl font-bold text-[#0c2461] mb-8 font-serif">Opzione 2</h2>
                <p class="text-xs text-center text-gray-400 mb-8 uppercase tracking-widest">Monogramma PM</p>
                <div class="w-full aspect-square flex items-center justify-center bg-[#faf9f6] rounded-xl p-4">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
                        <g transform="translate(200, 80)">
                            <circle cx="0" cy="0" r="40" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4" />
                            <text x="0" y="15" font-family="'Playfair Display', serif" font-size="45" fill="#0c2461" text-anchor="middle" font-weight="bold">PM</text>
                        </g>
                        <text x="200" y="170" font-family="'Playfair Display', serif" font-size="32" fill="#0c2461" text-anchor="middle" letter-spacing="3" font-weight="600">PIAZZA MARCONI</text>
                        <line x1="160" y1="190" x2="240" y2="190" stroke="#d4af37" stroke-width="2" />
                        <text x="200" y="220" font-family="'Playfair Display', serif" font-size="24" fill="#0c2461" text-anchor="middle" letter-spacing="8">CAFÈ</text>
                        <text x="200" y="260" font-family="Inter, sans-serif" font-size="10" fill="#a0a0a0" text-anchor="middle" letter-spacing="5">EST. 2015 • CALTANISSETTA</text>
                    </svg>
                </div>
            </div>

            <!-- Opzione 3 -->
            <div class="bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center hover:scale-105 transition-transform relative">
                <div class="absolute -top-4 bg-[#0c2461] text-white px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest shadow-md">Sul Sito Ora</div>
                <h2 class="text-xl font-bold text-[#0c2461] mb-8 font-serif">Opzione 3</h2>
                <p class="text-xs text-center text-gray-400 mb-8 uppercase tracking-widest">L'Evoluzione Classica</p>
                <div class="w-full aspect-square flex items-center justify-center bg-[#faf9f6] rounded-xl p-4">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
                        <g transform="translate(0, 20)">
                            <path d="M 175 105 C 175 125, 185 130, 200 130 C 215 130, 225 125, 225 105 Z" fill="#0c2461" />
                            <path d="M 225 108 C 235 108, 235 120, 225 120" fill="none" stroke="#0c2461" stroke-width="3" />
                            <path d="M 165 135 C 180 140, 220 140, 235 135" fill="none" stroke="#0c2461" stroke-width="2" stroke-linecap="round"/>
                            <path d="M 190 95 Q 195 85, 190 75 Q 185 65, 195 55" fill="none" stroke="#d4af37" stroke-width="2" />
                            <path d="M 210 95 Q 215 85, 210 75 Q 205 65, 215 55" fill="none" stroke="#d4af37" stroke-width="2" />
                        </g>
                        <text x="200" y="190" font-family="'Playfair Display', serif" font-size="34" fill="#0c2461" text-anchor="middle" font-weight="normal">Piazza Marconi</text>
                        <text x="200" y="235" font-family="'Playfair Display', serif" font-size="28" fill="#d4af37" text-anchor="middle" font-style="italic" letter-spacing="1">Café</text>
                        <path d="M 180 255 L 220 255" fill="none" stroke="#0c2461" stroke-width="1" />
                        <circle cx="200" cy="255" r="3" fill="#0c2461" />
                        <text x="200" y="280" font-family="Inter, sans-serif" font-size="12" fill="#666666" text-anchor="middle" letter-spacing="2">CALTANISSETTA</text>
                    </svg>
                </div>
            </div>
        </div>
        
        <div class="mt-16 text-center">
            <a href="/" class="inline-block bg-[#0c2461] text-white px-8 py-4 rounded-full font-serif text-lg shadow-xl hover:bg-blue-900 transition-colors">
                Guarda l'Opzione 3 live sul sito
            </a>
        </div>
    </div>
</body>
</html>
